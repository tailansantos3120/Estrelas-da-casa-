<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#090d16"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="./manifest.json"/>
<title>Estrelas da Casa - Cada um por si</title>
<style>
:root{--bg:#090d16;--s1:#111827;--s2:#1e293b;--bd:#283548;--tx:#f8fafc;--mt:#94a3b8;--gd:#fbbf24;--pr:#3b82f6;--ok:#10b981;--dn:#ef4444;--pp:#a855f7}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
input,select{user-select:text}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior-y:contain}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
#main-app{height:100%;display:flex;flex-direction:column}
header{padding:calc(env(safe-area-inset-top,10px) + 10px) 16px 12px;background:rgba(17,24,39,.95);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
header h1{font-size:15px;color:var(--gd);font-weight:800}
header p{font-size:11px;color:var(--mt)}
#scroll{flex:1;overflow-y:auto;padding:12px 16px calc(86px + env(safe-area-inset-bottom,12px));scroll-behavior:smooth}
#ptr{text-align:center;font-size:11px;color:var(--gd);height:0;overflow:hidden;transition:height .2s;display:flex;align-items:center;justify-content:center}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;font-weight:700}
.bg{font-size:11px;padding:3px 8px;border-radius:99px;font-weight:700;background:var(--s2);color:var(--mt)}
.bg-gd{background:rgba(251,191,36,.15);color:var(--gd);border:1px solid rgba(251,191,36,.3)}
.bg-ok{background:rgba(16,185,129,.15);color:var(--ok)}
.bg-dn{background:rgba(239,68,68,.15);color:var(--dn)}
.bg-pp{background:rgba(168,85,247,.15);color:var(--pp)}
.banner{background:linear-gradient(135deg,rgba(251,191,36,.2),rgba(245,158,11,.05));border:1px solid rgba(251,191,36,.4);border-radius:14px;padding:12px;text-align:center;margin-bottom:12px}
.banner strong{color:var(--gd);font-size:13px;display:block}
.banner span{font-size:11px;color:var(--mt)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mitem{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:10px;display:flex;justify-content:space-between;align-items:center}
.mitem.me{border-color:var(--gd)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);gap:10px}
.row:last-child{border-bottom:none}
.row h4{font-size:13px;margin-bottom:2px}
.row p{font-size:11px;color:var(--mt)}
.btn{border:none;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.b-pr{background:var(--pr);color:#fff}
.b-gd{background:var(--gd);color:#090d16}
.b-ok{background:var(--ok);color:#fff}
.b-dn{background:var(--dn);color:#fff}
.b-ol{background:var(--s2);border:1px solid var(--bd);color:var(--tx)}
.b-blk{width:100%;padding:14px;font-size:15px;display:block;text-align:center}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:11px;color:var(--mt);margin-bottom:5px;font-weight:700}
.inp{width:100%;background:var(--s2);border:1px solid var(--bd);color:var(--tx);padding:12px;border-radius:12px;font-size:14px;outline:none}
.inp:focus{border-color:var(--gd)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(17,24,39,.97);border-top:1px solid var(--bd);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,12px));z-index:30}
.ni{flex:1;background:none;border:none;color:var(--mt);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;cursor:pointer}
.ni.active{color:var(--gd)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
.mbox{background:var(--s1);border:1px solid var(--bd);border-radius:20px;width:100%;max-width:450px;max-height:85vh;overflow-y:auto;padding:18px}
.nitem{padding:8px 0;border-bottom:1px solid var(--bd);font-size:12px;line-height:1.4}
.nitem span{display:block;font-size:10px;color:var(--mt)}
.hidden{display:none!important}
.anim{animation:push .22s cubic-bezier(.22,1,.36,1)}
@keyframes push{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app">
  <div id="login-screen" style="padding:20px 16px;overflow-y:auto;height:100%">
    <div style="text-align:center;margin:12px 0 18px">
      <div style="font-size:38px">⭐🏠</div>
      <h1 style="font-size:21px;color:var(--gd);font-weight:800">Estrelas da Casa</h1>
      <p style="font-size:12px;color:var(--mt)">Cada um por si · Acesso Privado</p>
    </div>
    <div class="card">
      <div class="fg"><label>NOME DO PARTICIPANTE</label><input id="l-name" class="inp" type="text" placeholder="Tailan, Carol, Karine ou Caio"/></div>
      <div class="fg"><label>IDADE</label><input id="l-age" class="inp" type="number" inputmode="numeric" placeholder="Ex: 20"/></div>
      <div class="fg"><label>SENHA PESSOAL</label><input id="l-pass" class="inp" type="password" placeholder="Crie no 1º acesso ou digite a sua" onkeydown="if(event.key==='Enter')fazerLogin()"/></div>
      <p id="l-err" class="hidden" style="color:var(--dn);font-size:12px;font-weight:700;margin-bottom:10px"></p>
      <button type="button" onclick="fazerLogin()" class="btn b-gd b-blk">ENTRAR NO PAINEL</button>
      <p style="font-size:11px;color:var(--mt);margin-top:10px;text-align:center">No 1º acesso com Nome e Idade corretos, sua senha pessoal será criada.</p>
    </div>
    <div class="banner"><strong>Meta Final: R$ 150 para o 1º Colocado no Fim de Ano!</strong><span>Escala contínua até 31 de dezembro</span></div>
  </div>

  <div id="main-app" class="hidden">
    <header>
      <div><h1>Estrelas da Casa - Cada um por si</h1><p id="h-sub">Olá</p></div>
      <div style="display:flex;gap:8px">
        <button type="button" class="btn b-ol" onclick="reqNotif()">🔔</button>
        <button type="button" class="btn b-ol" onclick="openAcc()">Conta</button>
      </div>
    </header>
    <div id="scroll"><div id="ptr">↻ Puxe para atualizar...</div><div id="tab-view" class="anim"></div></div>
    <nav>
      <button type="button" class="ni active" data-t="painel" onclick="goTab('painel')"><span>🏠</span><span>Painel</span></button>
      <button type="button" class="ni" data-t="ranking" onclick="goTab('ranking')"><span>🏆</span><span>Ranking</span></button>
      <button type="button" class="ni" data-t="regras" onclick="goTab('regras')"><span>📜</span><span>Regras</span></button>
    </nav>
  </div>

  <div id="modal" class="modal hidden" onclick="if(event.target.id==='modal')closeM()"><div class="mbox" id="mbox"></div></div>
</div>
