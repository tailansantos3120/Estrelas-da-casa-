<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <title>Estrelas da Casa - Cada um por si</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-2: #1e293b;
      --border: #283548;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --gold: #fbbf24;
      --gold-dim: rgba(251, 191, 36, 0.15);
      --primary: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --purple: #a855f7;
      --safe-top: env(safe-area-inset-top, 12px);
      --safe-bottom: env(safe-area-inset-bottom, 12px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, select, textarea { user-select: text; }

    html, body {
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overscroll-behavior-y: contain;
      overflow: hidden;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      background: var(--bg);
    }

    header {
      padding: calc(var(--safe-top) + 10px) 16px 12px;
      background: rgba(17, 24, 39, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .brand h1 { font-size: 16px; font-weight: 800; color: var(--gold); }
    .brand p { font-size: 11px; color: var(--text-muted); }
    .header-actions { display: flex; gap: 8px; align-items: center; }

    .icon-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    #scroll-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 16px calc(84px + var(--safe-bottom));
      position: relative;
      scroll-behavior: smooth;
    }

    #ptr-indicator {
      text-align: center;
      font-size: 12px;
      color: var(--gold);
      height: 0;
      overflow: hidden;
      transition: height 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen-enter { animation: slideIn 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(18px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .card-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }

    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 700;
      background: var(--surface-2);
      color: var(--text-muted);
    }

    .badge-gold { background: var(--gold-dim); color: var(--gold); border: 1px solid rgba(251, 191, 36, 0.3); }
    .badge-success { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .badge-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    .badge-purple { background: rgba(168, 85, 247, 0.15); color: var(--purple); }

    .prize-banner {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(245, 158, 11, 0.05));
      border: 1px solid rgba(251, 191, 36, 0.4);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      margin-bottom: 12px;
    }

    .prize-banner strong { color: var(--gold); font-size: 13px; display: block; }
    .prize-banner span { font-size: 11px; color: var(--text-muted); }

    .mini-rank-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .mini-rank-item {
      background: var(--surface-2);
      border-radius: 12px;
      padding: 10px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mini-rank-item.active-user { border-color: var(--gold); }

    .task-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .task-row:last-child { border-bottom: none; }
    .task-info h4 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .task-info p { font-size: 11px; color: var(--text-muted); }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-gold { background: var(--gold); color: #090d16; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-block { width: 100%; padding: 12px; font-size: 14px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }

    .input-control {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }
    .input-control:focus { border-color: var(--gold); }

    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(17, 24, 39, 0.96);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      display: flex;
      padding: 8px 8px calc(8px + var(--safe-bottom));
      z-index: 30;
    }

    .nav-item {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-item.active { color: var(--gold); }
    .nav-item span.icon { font-size: 18px; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 450px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 18px;
      animation: slideUp 0.22s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .notif-item { padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 12px; line-height: 1.4; }
    .notif-item:last-child { border-bottom: none; }
    .notif-time { font-size: 10px; color: var(--text-muted); display: block; margin-top: 2px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <div id="login-screen" style="padding: 24px 18px; overflow-y: auto; height: 100%;">
      <div style="text-align: center; margin: 24px 0 28px;">
        <div style="font-size: 42px; margin-bottom: 8px;">⭐🏠</div>
        <h1 style="font-size: 22px; font-weight: 800; color: var(--gold);">Estrelas da Casa</h1>
        <p style="font-size: 13px; color: var(--text-muted);">Cada um por si · Acesso Privado</p>
      </div>

      <div class="card">
        <div class="form-group">
          <label for="login-name">NOME DO PARTICIPANTE</label>
          <input id="login-name" class="input-control" type="text" placeholder="Ex: Tailan, Carol, Karine ou Caio" autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="login-age">IDADE</label>
          <input id="login-age" class="input-control" type="number" inputmode="numeric" placeholder="Digite sua idade" />
        </div>
        <div class="form-group">
          <label for="login-pass">SENHA PESSOAL</label>
          <input id="login-pass" class="input-control" type="password" placeholder="Crie no 1º acesso ou digite sua senha" />
        </div>
        <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 14px;">
          No seu primeiro acesso com Nome e Idade corretos, a senha digitada será salva como sua senha pessoal.
        </p>
        <p id="login-error" class="hidden" style="color: var(--danger); font-size: 12px; font-weight: 600; margin-bottom: 12px;"></p>
        <button id="btn-login" class="btn btn-gold btn-block">Entrar no Painel</button>
      </div>

      <div class="prize-banner">
        <strong>Meta Final: R$ 150 para o 1º Colocado no Fim de Ano!</strong>
        <span>Escala contínua até 31 de dezembro</span>
      </div>
    </div>

    <div id="main-app" class="hidden" style="height: 100%; display: flex; flex-direction: column;">
      <header>
        <div class="brand">
